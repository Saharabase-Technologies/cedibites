name: Deploy Cedibites Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          envs: GH_TOKEN
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/production/nextjs/cedibites
            # GitHub stopped serving anonymous git fetches to this server on
            # 2026-09-02. Every GET still works, including a 38MB codeload
            # tarball, but the git-upload-pack POST that carries the actual
            # objects returns 401 with `www-authenticate: Basic realm="GitHub"`.
            # The repos are public and the server's credential store has been
            # empty since June, so the deploys had simply been relying on
            # anonymous access all along.
            #
            # Deploy keys are disabled by org policy, so the fetch authenticates
            # with the workflow's own GITHUB_TOKEN instead. It is minted for this
            # job and expires with it, which is why nothing long-lived is stored
            # on the server. `-c` keeps the header on this one command rather
            # than writing it into .git/config.
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch origin main
            git reset --hard origin/main
            npm ci

            # Hook-order violations white-screen a route at runtime and are
            # invisible to tsc AND to next build - both pass happily on code
            # that throws "Rendered more hooks than during the previous render".
            # This has taken production down twice. `set -e` means a failure
            # here stops the deploy BEFORE pm2 restarts, so the running build
            # stays up.
            npm run lint:hooks

            npm run build
            pm2 restart cedibites-pos-frontend

            # Health check — confirm PM2 process is online
            sleep 3
            pm2 show cedibites-pos-frontend | grep -q "online" && echo "Deploy OK" || (echo "Deploy FAILED: process not online" && exit 1)