name: Deploy Cedibites Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/production/nextjs/cedibites
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            pm2 restart cedibites-pos-frontend

            # Health check — confirm PM2 process is online
            sleep 3
            pm2 show cedibites-pos-frontend | grep -q "online" && echo "Deploy OK" || (echo "Deploy FAILED: process not online" && exit 1)