name: Deploy Cedibites Beta Frontend

on:
  push:
    branches:
      - beta
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy to beta (e.g. feature/ims)'
        required: true
        default: 'beta'

# Never cancel a deploy that is already running, and never run two at once.
# See deploy.yml - a cancelled run mid-`next build` erases the build output and
# takes the site down for anyone without a warm cache.
concurrency:
  group: deploy-frontend-beta
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # A cold `npm ci` plus a full build runs well past the 10m default.
          command_timeout: 25m
          script: |
            set -e
            cd /var/www/beta/nextjs/cedibites
            DEPLOY_BRANCH="${{ github.event.inputs.branch || 'beta' }}"
            git fetch origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            npm ci

            # Hook-order violations white-screen a route at runtime and are
            # invisible to tsc AND to next build - both pass happily on code
            # that throws "Rendered more hooks than during the previous render".
            # This has taken production down twice. `set -e` means a failure
            # here stops the deploy BEFORE pm2 restarts, so the running build
            # stays up.
            npm run lint:hooks

            # ---- Build into a scratch directory, never the live one --------
            # `next build` erases its output directory before it writes, so an
            # interrupted build otherwise leaves the running process serving
            # HTML that points at static chunks which no longer exist on disk.
            # See deploy.yml for the full account of the 2026-08-07 outage.
            rm -rf .next-build
            NEXT_DIST_DIR=.next-build npm run build

            # ---- Swap it in atomically ------------------------------------
            # A rename inside one filesystem is atomic: .next is either wholly
            # the old build or wholly the new one, never half-written.
            rm -rf .next-old
            if [ -d .next ]; then mv .next .next-old; fi
            mv .next-build .next

            pm2 restart cedibites-beta-frontend
            sleep 5

            # ---- Health check that can actually fail -----------------------
            # "pm2 says online" proves nothing: a live `next start` keeps
            # rendering HTML from memory long after its static files are gone.
            # Fetch a real page, pull a real asset URL out of it, and prove that
            # asset serves.
            BASE="https://beta.cedibites.com"
            ok=0
            for attempt in 1 2 3 4 5; do
              HTML=$(curl -sf --max-time 20 "$BASE/staff/login" || true)
              ASSET=$(printf '%s' "$HTML" | grep -oE '/_next/static/[^"]+\.(css|js)' | head -1 || true)
              if [ -n "$ASSET" ] && curl -sf --max-time 20 -o /dev/null "$BASE$ASSET"; then
                ok=1
                break
              fi
              echo "Health check attempt $attempt failed; retrying in 5s..."
              sleep 5
            done

            if [ "$ok" != "1" ]; then
              echo "Deploy FAILED health check - static assets are not serving."
              if [ -d .next-old ]; then
                rm -rf .next-broken
                mv .next .next-broken
                mv .next-old .next
                pm2 restart cedibites-beta-frontend
                echo "Rolled back to the previous build. Bad build kept at .next-broken."
              else
                echo "No previous build available to roll back to."
              fi
              exit 1
            fi

            echo "Deploy OK - served $ASSET"
