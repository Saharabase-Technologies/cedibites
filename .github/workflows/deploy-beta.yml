name: Deploy Cedibites Beta Frontend

on:
  push:
    branches:
      - beta
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy to beta (e.g. feature/ims)'
        required: true
        default: 'beta'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/beta/nextjs/cedibites
            DEPLOY_BRANCH="${{ github.event.inputs.branch || 'beta' }}"
            git fetch origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            npm ci
            npm run build
            pm2 restart cedibites-beta-frontend

            # Health check — confirm PM2 process is online
            sleep 3
            pm2 show cedibites-beta-frontend | grep -q "online" && echo "Deploy OK" || (echo "Deploy FAILED: process not online" && exit 1)
